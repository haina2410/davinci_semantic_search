name: Publish Windows release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -q
      - name: Build and publish tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME
          $build = @{ Version = $version }
          $previous = gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($previous) { $build.PreviousVersion = $previous }
          $package = ./scripts/build-release.ps1 @build
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ./tests/test_installation.ps1 -Setup $package.Installer -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $version $package.Installer $package.Checksum --verify-tag --title "Davinci Semantic Search $version" --notes-file $package.Notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
